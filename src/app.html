<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Preconnect to third-party origins -->
		<link rel="preconnect" href="https://www.googletagmanager.com" />
		<link rel="dns-prefetch" href="https://www.googletagmanager.com" />
		<!-- Preload TikTok Sans fonts (used in preview card) -->
		<link rel="preload" href="/fonts/TikTokSans12pt-Regular.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/TikTokSans12pt-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/TikTokSans36pt-Bold.woff2" as="font" type="font/woff2" crossorigin />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
